services:
  autotraffic-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autotraffic_predict_ai
    ports:
      - "0.0.0.0:8501:8501"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./src:/app/src
      - ./app.py:/app/app.py
    environment:
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
